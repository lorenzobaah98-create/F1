/* V6 — Live tyre-colour theme. Active only inside a circuit detail. */
.tyre-theme{--tyre-color:#ffd24f;--tyre-rgb:255,210,79;--tyre-ink:#101724;--tyre-soft:#fff2b0;}
.tyre-theme-soft{--tyre-color:#ff5368;--tyre-rgb:255,83,104;--tyre-ink:#fff;--tyre-soft:#ffc5cd;}
.tyre-theme-medium{--tyre-color:#ffd24f;--tyre-rgb:255,210,79;--tyre-ink:#121620;--tyre-soft:#fff1af;}
.tyre-theme-hard{--tyre-color:#f6f7fb;--tyre-rgb:246,247,251;--tyre-ink:#121620;--tyre-soft:#fff;}
.tyre-theme-intermediate{--tyre-color:#61e4a2;--tyre-rgb:97,228,162;--tyre-ink:#10251d;--tyre-soft:#b9f7d9;}
.tyre-theme-wet{--tyre-color:#58a6ff;--tyre-rgb:88,166,255;--tyre-ink:#0c1c31;--tyre-soft:#b7d9ff;}
.tyre-theme .red-dot,.tyre-theme .tab-row .chip.active{color:var(--tyre-color)}
.tyre-theme .tab-row .chip.active,.tyre-theme .chip.active{border-color:var(--tyre-color);background:rgba(var(--tyre-rgb),.12);box-shadow:inset 0 0 0 1px rgba(var(--tyre-rgb),.08)}
.tyre-theme .track-hero{border-color:rgba(var(--tyre-rgb),.35);background:radial-gradient(ellipse at 74% 57%,rgba(var(--tyre-rgb),.09),transparent 65%),#151e2e;transition:background .25s,border-color .25s}
.tyre-theme .tyre-option.selected{border:2px solid var(--tyre-color);background:rgba(var(--tyre-rgb),.14);box-shadow:0 0 20px rgba(var(--tyre-rgb),.16),inset 0 0 0 1px rgba(var(--tyre-rgb),.13);transform:translateY(-2px);color:var(--tyre-color)}
.tyre-theme .tyre-option{transition:background .22s,border-color .22s,box-shadow .22s,transform .22s}
.tyre-live-banner{position:relative;display:flex;align-items:center;gap:15px;overflow:hidden;border-radius:18px;border:1px solid rgba(var(--tyre-rgb),.55);background:linear-gradient(110deg,rgba(var(--tyre-rgb),.20),#101927 73%);padding:17px 15px;margin:12px 0 13px;box-shadow:0 0 30px rgba(var(--tyre-rgb),.07);animation:tyre-appear .26s ease-out}
.tyre-live-banner::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;background:var(--tyre-color)}
.tyre-live-orbit{height:66px;width:66px;min-width:66px;display:grid;place-items:center;border:7px solid var(--tyre-color);border-radius:50%;box-shadow:inset 0 0 0 3px #0e1724,0 0 18px rgba(var(--tyre-rgb),.23);color:var(--tyre-color);font-size:25px;font-weight:1000;font-style:italic}
.tyre-live-info{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.tyre-live-info small{color:var(--tyre-soft);font-size:9px;letter-spacing:1.1px;font-weight:950}
.tyre-live-info strong{font-size:27px;letter-spacing:-.9px;line-height:1.05;color:var(--tyre-color);font-style:italic;text-transform:uppercase}
.tyre-live-info>span{font-size:11px;color:#b9c5d7;line-height:1.35}
.tyre-live-signal{position:absolute;right:12px;top:12px;font-size:8px;letter-spacing:1px;color:var(--tyre-color);font-weight:900}
.tyre-theme .selectors{border-color:rgba(var(--tyre-rgb),.28);background:linear-gradient(145deg,rgba(var(--tyre-rgb),.065),#111a2a 56%)}
.tyre-theme .timing-panel{background:linear-gradient(150deg,rgba(var(--tyre-rgb),.13),#111927 60%);border-color:rgba(var(--tyre-rgb),.55);box-shadow:0 8px 30px rgba(var(--tyre-rgb),.05)}
.tyre-theme .timing-panel .eyebrow,.tyre-theme .timing-live{color:var(--tyre-color)}
.tyre-theme .timing-panel .field input:focus{border-color:var(--tyre-color);box-shadow:0 0 0 3px rgba(var(--tyre-rgb),.20)}
.tyre-theme .total-field input{border-color:var(--tyre-color);color:var(--tyre-soft);box-shadow:inset 0 0 0 1px rgba(var(--tyre-rgb),.16)}
.tyre-theme .total-field input:read-only{background:rgba(var(--tyre-rgb),.09);color:var(--tyre-soft)}
.tyre-theme .save-lap{background:var(--tyre-color);color:var(--tyre-ink);box-shadow:0 8px 24px rgba(var(--tyre-rgb),.18);transition:background .22s,box-shadow .22s,transform .22s}
.tyre-theme .save-lap:active{transform:scale(.99)}
.tyre-theme .best-grid .mini{border-color:rgba(var(--tyre-rgb),.26)}
.tyre-theme .best-grid .mini strong{color:var(--tyre-color)}
.tyre-theme .keyboard-tip{border-color:rgba(var(--tyre-rgb),.32);background:rgba(var(--tyre-rgb),.065)}
.tyre-theme .keyboard-tip>span,.tyre-theme .keyboard-tip strong{color:var(--tyre-color)}
.tyre-theme .setup-head{border-color:rgba(var(--tyre-rgb),.48);background:linear-gradient(120deg,rgba(var(--tyre-rgb),.13),#142939 75%)}
.tyre-theme .setup-group h3>span,.tyre-theme .setup-line strong{color:var(--tyre-color)!important}
.tyre-theme .coach{border-color:rgba(var(--tyre-rgb),.40)}
.tyre-theme .coach h3{color:var(--tyre-color)}
.tyre-theme .tyre-recommendation{border-color:rgba(var(--tyre-rgb),.35)}
.tyre-theme .tyre-best-list{border-color:rgba(var(--tyre-rgb),.30)}
.tyre-record-soft{--record-accent:#ff5368;--record-rgb:255,83,104}
.tyre-record-medium{--record-accent:#ffd24f;--record-rgb:255,210,79}
.tyre-record-hard{--record-accent:#f6f7fb;--record-rgb:246,247,251}
.tyre-record-intermediate{--record-accent:#61e4a2;--record-rgb:97,228,162}
.tyre-record-wet{--record-accent:#58a6ff;--record-rgb:88,166,255}
.tyre-record-unknown{--record-accent:#a9b6c9;--record-rgb:169,182,201}
.lap-record[class*="tyre-record-"]{border-left:3px solid var(--record-accent);background:linear-gradient(95deg,rgba(var(--record-rgb),.12),#141c2b 56%)}
.lap-record[class*="tyre-record-"] .record-time{color:var(--record-accent)}
@keyframes tyre-appear{from{opacity:.7;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.tyre-live-banner{animation:none}.tyre-theme .tyre-option{transition:none}}
@media(max-width:390px){.tyre-live-banner{gap:12px;padding:14px 11px}.tyre-live-orbit{width:55px;min-width:55px;height:55px;border-width:6px}.tyre-live-info strong{font-size:23px}.tyre-live-signal{font-size:7px;top:8px;right:8px}}

/* V7 — Setup telemetry and practice/qualifying sessions. */
.setup-telemetry-section{margin-top:20px;margin-bottom:20px}
.setup-telemetry-section .section-heading h2{font-size:23px}
.setup-telemetry-section .tyre-live-banner{margin-top:15px}
.setup-timing-summary{background:linear-gradient(135deg,rgba(var(--tyre-rgb),.13),#131c2d 67%);border:1px solid rgba(var(--tyre-rgb),.38);border-radius:17px;padding:16px;margin:12px 0 14px}
.setup-timing-label{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--tyre-color);font-size:10px;font-weight:950;letter-spacing:1px}
.setup-timing-label span:last-child{font-size:9px;color:#aab9ce;letter-spacing:.5px}
.setup-time-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.setup-time-cards>div{padding:12px 10px;border:1px solid #35465d;border-radius:12px;background:#0d1727;min-width:0}
.setup-time-cards small,.setup-sector-strip small{display:block;color:#9cacc3;font-size:9px;font-weight:900;letter-spacing:.7px}
.setup-time-cards strong{display:block;color:var(--tyre-color);font-size:clamp(17px,5vw,26px);font-variant-numeric:tabular-nums;margin-top:6px;letter-spacing:-.4px}
.setup-sector-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.setup-sector-strip>div{border-radius:10px;background:#111f2d;padding:10px 8px;min-width:0}
.setup-sector-strip b{display:block;font-size:14px;font-variant-numeric:tabular-nums;color:#dce8fa;margin-top:6px}
.setup-timing-panel{margin-bottom:8px}
.saved-lap-meta{color:#9ee7ff;font-weight:850;line-height:1.8}
@media(max-width:360px){.setup-time-cards strong{font-size:18px}.setup-sector-strip b{font-size:12px}}

/* V8: responsive selected-car showcase */
.car-showcase{position:relative;isolation:isolate;overflow:hidden;min-height:245px;margin:6px 0 22px;border-radius:18px;border:1px solid color-mix(in srgb,var(--car-main) 46%,#34415b);background:radial-gradient(ellipse at 73% 69%,color-mix(in srgb,var(--car-main) 25%,transparent),transparent 65%),linear-gradient(135deg,#101c2b 5%,color-mix(in srgb,var(--car-deep) 25%,#0b111d) 62%,#080e18 100%);box-shadow:inset 0 1px 0 #ffffff13,0 10px 28px #00000022;}
.car-showcase:before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--car-main),var(--car-accent),transparent 80%);z-index:2}
.car-showcase-grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:28px 28px;transform:perspective(220px) rotateX(24deg) scale(1.3);transform-origin:center bottom;mask-image:linear-gradient(transparent 10%,#000 100%);opacity:.6;z-index:-1;}
.car-showcase-copy{position:relative;z-index:2;padding:18px 19px 0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;pointer-events:none}
.car-showcase-kicker{font-size:9px;letter-spacing:1.7px;color:#c7d4e7;font-weight:950;display:flex;gap:8px;align-items:center}
.car-showcase-dot{width:7px;height:7px;border-radius:50%;background:var(--car-accent);box-shadow:0 0 12px var(--car-accent)}
.car-showcase-copy strong{font-size:clamp(22px,7vw,34px);font-style:italic;font-weight:1000;letter-spacing:-1.3px;color:#fff;text-shadow:0 2px 14px #0007;line-height:1.2}
.car-showcase-sub{color:#b9c9df;font-size:11px;font-weight:700}

.car-showcase-bottom{position:relative;z-index:2;display:flex;justify-content:space-between;gap:10px;padding:11px 18px;background:linear-gradient(90deg,#070d17da,#0b1525c9);border-top:1px solid #ffffff1c;font-size:9px;letter-spacing:1.2px;color:#b2c1d4;font-weight:900}

/* ───────────────────────────────────────────────────────────────
   V13 • PADDOCK EDITION / REFINED DARK GARAGE
   Cleaner mobile-first visual hierarchy, no double-tap zoom.
   ─────────────────────────────────────────────────────────────── */
:root{
 --bg:#080a0f;--panel:#121620;--panel2:#191e2b;--border:#292f3d;
 --text:#f7f8fc;--muted:#8c96a8;--red:#ff3855;--cyan:#8fe7ff;
 --green:#79e6b4;--yellow:#ffd56c;
}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
html,body,#app,.app-shell,button,a,input,textarea,select,summary{touch-action:manipulation}
body{
 background:radial-gradient(ellipse 95% 420px at 50% -180px,#3a1723 0%,transparent 84%),
 linear-gradient(180deg,#080a0f,#0a0c12 60%,#07080d);
 color:var(--text);min-height:100dvh;
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
}
button{-webkit-tap-highlight-color:transparent;transition:background-color .18s,border-color .18s,transform .18s,box-shadow .18s}
button:active{transform:scale(.978)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ff687e;outline-offset:3px}
.app-shell{max-width:790px;padding:0 19px 132px;margin:auto}
.v13-topbar{padding:calc(18px + env(safe-area-inset-top)) 0 21px;gap:8px;align-items:center}
.v13-topbar .brand{font-size:33px;letter-spacing:-2.2px;display:flex;align-items:baseline;gap:0}
.v13-topbar .brand .brand-f1{color:#fff;font-weight:1000}
.v13-topbar .brand .brand-25{color:var(--red);font-weight:1000}
.v13-topbar .brand .version{position:relative;top:-12px;margin-left:7px;border:1px solid #5b2837;border-radius:4px;background:#311722;color:#ff9aa7;padding:3px 5px;font-size:8px;letter-spacing:.8px;font-weight:950}
.v13-topbar .tagline{font-size:8px;letter-spacing:2.4px;margin-top:7px;color:#8792a5;font-weight:850}
.v13-topbar .top-actions{gap:8px}
.v13-season{border:1px solid #303542;border-radius:11px;padding:7px 11px;background:#131722;min-width:79px;display:flex;flex-direction:column;gap:1px}
.v13-season span{font-size:8px;letter-spacing:1.3px;font-weight:900;color:#9fa8ba}
.v13-season select{font-weight:900;color:#fff;font-size:14px;border:0;background:transparent;outline:none;padding:1px 0;min-width:0;appearance:none;-webkit-appearance:none}
.v13-season option{color:#fff;background:#10131b}
.v13-settings{border-radius:11px;background:#141924;border-color:#303642;font-size:20px;width:43px;height:43px}
.season-heading,.season-strip{display:none!important}
/* Reusable typography */
.section{margin-top:28px}.section-heading{margin-bottom:13px;gap:10px;align-items:end}
.section h2,.section-heading h2{font-size:clamp(22px,5.8vw,30px);letter-spacing:-1.2px;font-weight:950;line-height:1.12;margin:7px 0 0}
.v13-eyebrow{font-size:9px;font-weight:950;letter-spacing:2px;color:#9ba5b6}
.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:900}
.red-dot{color:var(--red)}
.sub{color:#a5aebe;font-size:13px;line-height:1.65}
.text-link{background:transparent;border:0;color:#ff7186;font-size:10px;font-weight:950;letter-spacing:1.2px;white-space:nowrap;padding:10px 0}
.label{font-size:10px;letter-spacing:1.4px;color:#a6b0c1}
/* Homepage hero */
.v13-hero{position:relative;isolation:isolate;overflow:hidden;border-radius:23px;border:1px solid #663042;background:linear-gradient(135deg,#28121e 0%,#17111b 42%,#10131d 100%);box-shadow:0 18px 44px #0006, inset 0 1px 0 #ffffff17}
.v13-hero:before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 92% 30%,#ff375a36,transparent 57%),linear-gradient(130deg,#ff5c750b,transparent 56%);z-index:-1}
.v13-hero:after{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(90deg,transparent 30%,#000);z-index:-1;opacity:.75}
.v13-hero-art{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.v13-watermark{position:absolute;right:-19px;top:32px;font-size:clamp(180px,54vw,340px);line-height:.95;letter-spacing:-33px;font-style:italic;font-weight:1000;color:#ffffff09;transform:rotate(-9deg)}
.v13-speedline{position:absolute;right:-30%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#ff4c6666,transparent);transform:rotate(-27deg);filter:blur(.3px)}
.v13-speedline.a{top:20%}.v13-speedline.b{top:45%;opacity:.5}.v13-speedline.c{top:70%;opacity:.3}
.v13-hero-inner{position:relative;padding:29px 23px 25px;z-index:1}
.v13-hero-eyebrow{display:flex;align-items:center;gap:9px;color:#f6c9d2;font-size:9px;letter-spacing:1.45px;font-weight:900}
.v13-live-dot{display:inline-block;width:7px;height:7px;flex:0 0 7px;background:#ff4764;border-radius:50%;box-shadow:0 0 0 4px #ff476425,0 0 14px #ff47646b}
.v13-version{margin-left:auto;border:1px solid #b34d6580;background:#3b1b2a9c;padding:5px 7px;border-radius:6px;color:#ff9aaa;font-size:9px}
.v13-hero h1{margin:24px 0 12px;font-size:clamp(39px,11.5vw,71px);line-height:.98;letter-spacing:-2.8px;font-weight:1000;color:#fff;font-style:italic;text-shadow:0 5px 20px #0005}
.v13-hero h1 em{font-style:italic;color:#ff4b67}
.v13-hero p{color:#b9becb;font-size:13px;line-height:1.65;margin:0 0 23px}
.v13-hero-actions{display:flex;gap:9px;flex-wrap:wrap}
.v13-cta{border-radius:12px;padding:15px 18px;min-height:49px;background:linear-gradient(110deg,#ff3c5a,#e82346);box-shadow:0 9px 25px #ff33502e;display:flex;align-items:center;justify-content:space-between;gap:24px;font-size:11px;letter-spacing:1px}
.v13-cta span{font-size:17px}
.v13-hero-secondary{border:1px solid #ffffff32;background:#ffffff0a;border-radius:12px;color:#f3dbe1;font-weight:900;font-size:10px;letter-spacing:.8px;padding:12px 14px;min-height:49px}
.v13-hero-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #ffffff1d;padding:13px 21px;color:#aab0bf;font-size:8px;letter-spacing:1.15px;font-weight:850;background:#070b1299}
.v13-hero-foot b{color:#fff;font-size:12px;margin-right:4px}
/* Slim, unified stat bar */
.v13-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:14px 0 17px;border:1px solid #303542;border-radius:16px;background:linear-gradient(130deg,#161a24,#10141d);overflow:hidden}
.v13-metrics>div{padding:15px 10px 13px;text-align:center;min-width:0}
.v13-metrics>div+div{border-left:1px solid #303542}
.v13-metrics small{display:block;font-size:8px;font-weight:900;letter-spacing:.65px;color:#919aac;min-height:23px}
.v13-metrics strong{display:block;font-size:26px;font-weight:950;letter-spacing:-1px;color:#f4f6fc;margin-top:5px;font-variant-numeric:tabular-nums}
/* Last lap as hero telemetry */
.v13-last{position:relative;overflow:hidden;background:linear-gradient(115deg,#12252d,#101b25 75%,#10151f);border:1px solid #3a6c73;border-radius:18px;padding:20px 19px 0;box-shadow:inset 0 1px 0 #ffffff0e}
.v13-last:before{content:'';position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;border:27px solid #8de9ff06;pointer-events:none}
.v13-last-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.v13-last-head .session-badge{font-size:9px}
.v13-last-time{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:13px 0 9px;font-size:clamp(35px,9vw,52px);line-height:1;letter-spacing:-2px;color:#98ecfa;font-weight:950;font-variant-numeric:tabular-nums}
.v13-last-time>span{font-size:10px;letter-spacing:.6px;border:1px solid #4c777a;border-radius:8px;color:#a8e6d8;padding:7px 8px;font-weight:950;white-space:nowrap}
.v13-last-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#c6d5de;padding-bottom:16px}
.v13-last-meta .tyre-tag{font-size:9px;padding:5px 7px}
.v13-last-open{width:calc(100% + 38px);margin:0 -19px;padding:13px 19px;background:#ffffff0b;border:0;border-top:1px solid #ffffff1c;color:#a3ebf3;font-size:10px;font-weight:950;letter-spacing:1.3px;text-align:left;display:flex;justify-content:space-between}
.v13-first{padding-top:24px}.v13-first h2{font-size:22px;letter-spacing:-.7px;margin:12px 0 8px}.v13-first p{color:#a9c4d1;font-size:13px;margin-bottom:20px}
/* Last rounds - clean single-line log */
.v13-recent-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid #2d3442;border-radius:13px;background:linear-gradient(125deg,#171c29,#111720);padding:13px 13px;color:var(--text);margin:8px 0;min-height:68px}
.v13-recent-compound{display:grid;place-items:center;flex:0 0 33px;width:33px;height:33px;border:4px solid #f3f3f3;border-radius:50%;font-size:12px;font-weight:950;color:#fff;background:#0e1219}
.v13-recent-compound.soft{border-color:#ff516b;color:#ff7186}.v13-recent-compound.medium{border-color:#ffda54;color:#ffda54}.v13-recent-compound.hard{border-color:#f3f6fa;color:#f3f6fa}.v13-recent-compound.intermediate{border-color:#62e6a7;color:#62e6a7}.v13-recent-compound.wet{border-color:#62a5ff;color:#62a5ff}
.v13-recent-name{display:block;flex:1;min-width:0}
.v13-recent-name strong{display:block;font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v13-recent-name small{display:block;margin-top:5px;color:#9ca7b8;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v13-recent-value{text-align:right;flex:0 0 auto;font-weight:900;font-size:14px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.v13-recent-value small{display:block;margin-top:5px;color:#ff6c85;font-size:10px}
/* Track cards and search */
.track-card{background:linear-gradient(120deg,#191e2c,#121720);border-color:#30384b;border-radius:17px;padding:12px;margin:9px 0;box-shadow:0 6px 20px #00000020}
.track-thumb{background:radial-gradient(circle at 50% 50%,#222b3d,#0c121b);border:1px solid #2f394b;border-radius:12px}
.track-info strong{font-weight:900;letter-spacing:-.4px}
.track-info em{color:#92ddec}
.track-arrow{color:#ff7186}
.search-wrap .search{border-radius:13px;background:#111823;border-color:#333b4d}
/* Track detail / tab bar */
.v13-back{color:#b8c6d8;letter-spacing:1px;font-size:11px;margin-top:9px;padding-bottom:10px}
.v13-track-hero{margin-top:6px;padding:21px 20px 0;background:radial-gradient(ellipse at 80% 18%,#64223736,transparent 70%),linear-gradient(135deg,#171c29,#10151f);border-color:#3b3e4e;border-radius:20px;overflow:hidden}
.v13-track-hero .overline{font-size:10px;margin:11px 0 5px;color:#ff7e94}
.v13-track-hero h1{font-size:clamp(28px,8vw,43px);letter-spacing:-1.4px;margin:5px 0 0;line-height:1.1}

// V14: local, opt-in OCR for up to five race screenshots. No API key or image upload.
// V18: F1 25 LAP DELTA scanner. Reads lap number, lap-time column and tyre colour.
function scanTyre(text){
 const v=String(text||'').toLowerCase();
 if(/\b(intermediate|inter|inters|int)\b/.test(v))return 'Intermediate';
 if(/\b(wet|wets|full wet)\b/.test(v))return 'Wet';
 if(/\b(soft|softs)\b/.test(v))return 'Soft';
 if(/\b(medium|mediums|med)\b/.test(v))return 'Medium';
 if(/\b(hard|hards)\b/.test(v))return 'Hard';
 return '';
}
// OCR may drop the colon: 147.875 means 1:47.875; 215.977 means 2:15.977.
function scanNormalizeTime(t){
 let v=String(t||'').trim().replace(/[Oo]/g,'0').replace(/[’']/g,':').replace(/,/g,'.').replace(/\s/g,'');
 v=v.replace(/^[|lI](?=\d)/,'1');
 if(/^\d{3,4}\.\d{3}$/.test(v))v=v.slice(0,-6)+':'+v.slice(-6);
 if(/^\d{1,2}\.\d{2}\.\d{3}$/.test(v))v=v.replace('.',':');
 if(/^\d{1,2}:\d{2}:\d{3}$/.test(v))v=v.replace(/:(?=\d{3}$)/,'.');
 return v;
}
function scanTimeToken(text){
 const t=String(text||'').replace(/[Oo]/g,'0').replace(/([:.])[,.:](?=\d{3}(?:\D|$))/g,'$1').replace(/(\d)[,.](?=\d{3}(?:\D|$))/g,'$1.');
 if(/^\d{6}$/.test(t)){const guess=t[0]+':'+t.slice(1,3)+'.'+t.slice(3);const ms=parseTime(guess);return ms!=null&&ms>=40000&&ms<=1200000?formatTime(ms):'';}
 const found=[...t.matchAll(/(?:^|[^\d])((?:\d{1,2}[:.]\d{2}[.,:]\d{3})|(?:\d{3,4}[.,]\d{3}))(?!\d)/g)];
 for(const match of found.reverse()){
  const normalized=scanNormalizeTime(match[1]);const ms=parseTime(normalized);
  if(ms!=null&&ms>=40000&&ms<=1200000)return formatTime(ms);
 }
 return '';
}
function scanParseText(text){
 const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean), rows=[];
 for(let i=0;i<lines.length;i++){
  const line=lines[i].replace(/[|]/g,' ');
  const match=line.match(/^\s*(?:(?:lap|runde|r\.?|#)\s*)?(\d{1,3})(?=\s+|[.)\]-]\s*)/i);
  if(!match)continue;
  const lap=Number(match[1]);if(lap<1||lap>999)continue;
  // Pick the RIGHTMOST complete lap-time token, not a sector value.
  const rest=line.slice(match[0].length);const time=scanTimeToken(rest);
  if(!time)continue;
  const tyre=scanTyre(rest);
  rows.push({lapNumber:String(lap),time,tyre,source:'tekst'});
 }
 return rows;
}
function scanWordList(data){
 if(Array.isArray(data?.words)&&data.words.length)return data.words;
 const out=[];
 function walk(node){
  if(!node||typeof node!=='object')return;
  if(node.text&&node.bbox&&!node.words&&!node.lines&&!node.paragraphs)out.push(node);
  for(const key of ['blocks','paragraphs','lines','words'])if(Array.isArray(node[key]))node[key].forEach(walk);
 }
 if(Array.isArray(data?.blocks))data.blocks.forEach(walk);
 return out;
}
function scanColorTyre(canvas,y){
 const w=canvas.width,h=canvas.height;
 const ctx=canvas.getContext('2d',{willReadFrequently:true});
 // Tyre column of F1 25 LAP DELTA, includes a little extra room for monitor photos.
 const from=Math.floor(w*.70),to=Math.floor(w*.90),cy=Math.max(0,Math.min(h-1,Math.round(y)));
 const half=Math.max(6,Math.round(h*.008));
 const top=Math.max(0,cy-half),bottom=Math.min(h,cy+half+1);
 const pix=ctx.getImageData(from,top,Math.max(1,to-from),Math.max(1,bottom-top));
 const count={Soft:0,Medium:0,Wet:0,Intermediate:0};
 for(let i=0;i<pix.data.length;i+=4){
  const r=pix.data[i],g=pix.data[i+1],b=pix.data[i+2];
  if(r>110&&r>g*1.42&&r>b*1.3)count.Soft++;

async function scanRun(){

 let worker=null;const files=[...scanFiles];

   const status=$('#v14-scan-status');if(status)status.textContent=`Leser F1-tabellen i bilde ${current+1}/${files.length} …`;

    for(const row of [...result.rows,...retry.rows]){
     const key=String(row.lapNumber||'');if(!key)continue;
     const old=merged.get(key);
     if(!old){merged.set(key,{...row});continue;}
     const candidate={...old};
     for(const f of ['time','tyre','s1','s2','s3'])if((!candidate[f]||(f==='time'&&candidate.timeEstimated&&!row.timeEstimated))&&row[f]){candidate[f]=row[f];if(f==='time')candidate.timeEstimated=Boolean(row.timeEstimated);}
     const t=parseTime(candidate.time),parts=[candidate.s1,candidate.s2,candidate.s3].map(parseTime);
     candidate.sectorConfirmed=t!=null&&parts.every(x=>x!=null)&&Math.abs(parts.reduce((a,b)=>a+b,0)-t)<=12;
     merged.set(key,candidate);
    }
    result={...result,rows:[...merged.values()].sort((a,b)=>Number(a.lapNumber)-Number(b.lapNumber))};
    combined+=`\n--- Alternativ lesning ${current+1} ---\n${retry.raw}`;
   }
   all.push(...result.rows);combined+=`\n--- Bilde ${current+1} ---\n${result.raw}`;
  }
  const dedup=new Map();let missing=0;
  for(const row of [...all,...scanRows]){
   const key=row.lapNumber?String(row.lapNumber):`ukjent-${missing++}`;
   const old=dedup.get(key);
   if(!old)dedup.set(key,{...row});else{
    const merged={...old};for(const f of ['time','tyre','s1','s2','s3'])if((!merged[f]||(f==='time'&&merged.timeEstimated&&!row.timeEstimated))&&row[f]){merged[f]=row[f];if(f==='time')merged.timeEstimated=Boolean(row.timeEstimated);}
    const ms=parseTime(merged.time),p=[merged.s1,merged.s2,merged.s3].map(parseTime);
    merged.sectorConfirmed=ms!=null&&p.every(x=>x!=null)&&Math.abs(p.reduce((a,b)=>a+b,0)-ms)<=12;
    dedup.set(key,merged);
   }
  }
  scanRows=[...dedup.values()].sort((a,b)=>(Number(a.lapNumber)||9999)-(Number(b.lapNumber)||9999));for(const r of scanRows)scanReconcileRow(r,scanRows);scanRawPreview=combined;
  if(scanRows.length){
   const maxLap=Math.max(...scanRows.map(r=>Number(r.lapNumber)||0));
   if(!ui.raceLaps&&maxLap)ui.raceLaps=String(maxLap);
   const unknown=scanRows.filter(r=>!r.lapNumber||!r.tyre).length;
   const withSectors=scanRows.filter(r=>r.sectorConfirmed===true).length;
   const needsReview=scanRows.filter(r=>!r.time||!r.tyre||!r.lapNumber||r.timeEstimated||r.autoCorrected).length;
   scanStatus=`Fant ${scanRows.length} tabellrader og ${withSectors} bekreftede sektorsett. ${unknown?`${unknown} rader mangler rundenummer eller dekk. `:''}Kontroller alle rader før du lagrer.${needsReview?` ${needsReview} rader må kontrolleres, se gule markeringer.`:''}`;
  }else scanStatus='Ingen rundetider ble funnet. Trykk «Se hva SCAN faktisk leste» for feilsøking, eller beskjær bildet til LAP DELTA-tabellen og prøv igjen.';
 }catch(e){scanStatus=`SCAN-feil: ${e?.message||'Ukjent feil'}. Du kan legge inn rundene manuelt.`;}
 finally{try{await worker?.terminate();}catch{}scanBusy=false;render();}

function history(){const tracks=[...new Set(data.laps.map(l=>l.trackId))];return `<section class="section"><h2>Din sesonghistorikk</h2><p class="sub">Sammenlign rundetider fra år til år.</p><div class="stats"><div class="stat"><small>RUNDER TOTALT</small><strong>${data.laps.length}</strong></div><div class="stat"><small>LAGREDE SETUP</small><strong>${data.setups.length}</strong></div></div><p class="history-race-count">🏁 ${data.races.length} lagrede løpsresultater</p>${tracks.length?tracks.map(id=>{const t=TRACKS.find(t=>t.id===id);if(!t)return '';const years=[...new Set(data.laps.filter(l=>l.trackId===id).map(l=>l.season))].sort();return `<div class="panel"><h3>${esc(t.flag)} ${esc(t.name)}</h3>${years.map(y=>{const list=data.laps.filter(l=>l.trackId===id&&l.season===y);return `<div class="history-row"><div><b>${y}</b><small>Trening ${formatTime(bestLap(list,'Trening')?.totalMs)}</small><small>Race ${formatTime(bestLap(list,'Løp')?.totalMs)}</small></div><strong>Kvalifisering<br>${formatTime(bestLap(list,'Kvalifisering')?.totalMs)}</strong></div>`;}).join('')}<button class="ghost full" style="margin-top:15px" data-action="track" data-value="${id}">Åpne bane →</button></div>`;}).join(''):'<div class="empty">Ingen historikk ennå. Legg inn første rundetid under «Baner».</div>'}</section>`;}
function news(){return `<section class="section"><h2>Ekte Formel 1 🏁</h2><p class="sub">Nyheter og resultater fra virkelighetens F1. Nyheter krever internett.</p><div class="panel"><h3>Følg F1 direkte</h3><div class="button-row"><button class="secondary" data-action="external" data-value="https://www.formula1.com/en/latest/all">F1-nyheter ↗</button><button class="secondary" data-action="external" data-value="https://www.formula1.com/en/racing/2026">Løpskalender ↗</button></div><div class="button-row" style="margin-top:10px"><button class="ghost" data-action="external" data-value="https://www.formula1.com/en/results/2026/races">Resultater ↗</button><button class="ghost" data-action="external" data-value="https://www.bbc.com/sport/formula1">BBC Sport ↗</button></div></div><button class="primary full" data-action="news-refresh">↻ Hent nyhetsoverskrifter</button><p class="helper">${esc(ui.newsStatus||'Trykk for å hente ferske overskrifter fra BBC Sport.')}</p>${ui.news.map(n=>`<div class="news-card"><span class="news-date">${esc(n.date||'F1-nyhet')}</span><h3>${esc(n.title)}</h3><p>${esc(n.description||'')}</p><a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">Les saken ↗</a></div>`).join('')}<div class="notice">Nyhetsoverskrifter hentes fra en ekstern tjeneste og kan være midlertidig utilgjengelige. Lenker til de offisielle sidene fungerer uavhengig av dette.</div></section>`;}
function settings(){return `<section class="section"><h2>Innstillinger og sikkerhetskopi</h2><p class="sub">Rundetider og setup lagres lokalt på denne telefonen. De deles ikke automatisk med andre enheter.</p><div class="panel"><h3>Ta vare på rundetidene dine</h3><p class="sub">Lagre en sikkerhetskopi på iCloud Drive eller Mac. Hvis du sletter nettsteddata eller bytter telefon, kan lokal lagring forsvinne.</p><button class="primary full" data-action="export">↓ Last ned sikkerhetskopi</button><div class="field"><label>Gjenopprett sikkerhetskopi</label><input type="file" id="import-file" accept="application/json,.json"></div><button class="secondary full" data-action="import">↑ Importer fil</button></div><div class="panel"><h3>Om denne appen</h3><p class="sub">Gratis webapp V27 med banekart, dekkregistrering, sektorregistrering og 20 setup-verdier. Setup-forslag er startpunkter, ikke garanterte optimaloppsett.</p><button class="ghost full" data-action="settings">← Tilbake</button></div></section>`;}
function render(resetScroll=false){const content=ui.settings?settings():ui.trackId?detail():ui.screen==='home'?home():ui.screen==='tracks'?tracks():ui.screen==='history'?history():news();const theme=ui.trackId&&!ui.settings?` tyre-theme tyre-theme-${tyreClass(ui.tyre)}`:'';$('#app').innerHTML=`<div class="app-shell${theme}">${header()}${ui.notice?`<div class="success">${esc(ui.notice)}</div>`:''}${content}<p class="footer">F1 25 Lap Tracker V27 · Privat lagring på denne enheten<br>Banekart: F1-Track-Layouts-SVG / Wikimedia</p></div>${nav()}`;if(resetScroll)window.scrollTo({top:0,behavior:'instant'});}
function notify(s){ui.notice=s;render();}
function openTrack(id){scanReset();ui.trackId=id;ui.tab='laps';ui.issue='none';ui.editor=false;ui.editValues=null;ui.notice='';render(true);}
function saveLap(){
 const values=[ui.s1,ui.s2,ui.s3],parsed=values.map(parseTime);
 if(values.some((v,i)=>v.trim()&&parsed[i]==null)){alert('Ugyldig sektortid. Bruk f.eks. 32.456 eller 32,456.');return;}
 const total=parsed.every(v=>v!=null)?parsed.reduce((a,b)=>a+b,0):parseTime(ui.total);
 if(total==null){alert('Fyll inn alle tre sektorer eller skriv total rundetid, f.eks. 1:51.806');return;}
 const age=String(ui.tyreAge||'').trim();const lapNumber=String(ui.lapNumber||'').trim();
 if(lapNumber&&(!/^(?:\d{1,3})$/.test(lapNumber)||Number(lapNumber)<1)){alert('Rundenummer må være et positivt heltall.');return;}
 if(age&&!/^(?:\d{1,3})$/.test(age)){alert('Antall runder på dekket må være et helt tall, f.eks. 5.');return;}
 data.laps.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),trackId:ui.trackId,season:data.season,car:ui.car,session:ui.session,weather:ui.weather,tyre:ui.tyre,tyreAge:age,lapNumber:ui.session==='Løp'?lapNumber:'',s1:ui.s1.trim(),s2:ui.s2.trim(),s3:ui.s3.trim(),totalMs:total,createdAt:new Date().toISOString()});
 ui.s1=ui.s2=ui.s3=ui.total=ui.tyreAge=ui.lapNumber='';
 persist();notify(`${sessionLabel(ui.session)}: ${formatTime(total)} på ${ui.tyre}-dekk er lagret!`);
}
function saveRaceV12(){
 const digits=(v,min,max,label,required=false)=>{const str=String(v??'').trim().replace(/^P/i,'');if(!str){if(required)throw Error(`Fyll inn ${label}.`);return null;}if(!/^\d+$/.test(str)||Number(str)<min||Number(str)>max)throw Error(`${label} må være mellom ${min} og ${max}.`);return Number(str);};
 try{
  const prepared=[];const seen=new Set();
  for(let i=0;i<scanRows.length;i++){
   const row=scanRows[i];const lap=digits(row.lapNumber,1,999,`rundenummer i rad ${i+1}`,true);
   if(seen.has(lap))throw Error(`Runde ${lap} finnes flere ganger. Slett eller korriger den ene.`);
   seen.add(lap);
   const ms=parseTime(row.time);
   if(!ms||ms<45000||ms>1200000){
    // Keep incomplete rows in the review until user chooses to omit them.
    // Never invent a time and never silently save a missing lap.
    throw Error(`Runde ${lap} mangler gyldig rundetid. Åpne Racerunder og rett tiden før lagring. Du kan også slette den ufullstendige raden hvis du ikke vil lagre den.`);
   }
   if(!TYRES.some(t=>t[0]===row.tyre))throw Error(`Velg dekk for runde ${lap}.`);
   const parts=[row.s1,row.s2,row.s3].map(v=>String(v||'').trim());
   const partsMs=parts.map(parseTime);
   const validSectors=parts.every(Boolean)&&partsMs.every(v=>v!=null)&&Math.abs(partsMs.reduce((a,b)=>a+b,0)-ms)<15;
   prepared.push({lapNumber:lap,totalMs:ms,tyre:row.tyre,s1:validSectors?parts[0]:'',s2:validSectors?parts[1]:'',s3:validSectors?parts[2]:''});
  }
  const estimated=scanRows.filter(r=>r.timeEstimated).map(r=>r.lapNumber);
  if(estimated.length&&!confirm(`Rundetid på runde ${estimated.join(', ')} er beregnet fra sektorene, ikke sikkert lest fra bildet. Den kan avvike noen tusendeler. Har du kontrollert og godtar tiden?`))return;
  const inferredLaps=prepared.length?Math.max(...prepared.map(r=>r.lapNumber)):null;
  const laps=digits(ui.raceLaps||inferredLaps,1,999,'antall kjørte runder',true);
  if(prepared.some(r=>r.lapNumber>laps))throw Error('Et scannet rundenummer er høyere enn antall kjørte runder.');
  const best=prepared.length?prepared.reduce((a,b)=>a.totalMs<b.totalMs?a:b):null;
  const time=best?best.totalMs:parseTime(ui.raceBestTime);
  if(!time)throw Error('Skriv beste rundetid eller scan bilder først.');
  const lapNumber=best?best.lapNumber:digits(ui.raceBestLap,1,laps,'rundenummer for beste tid');
  const start=digits(ui.raceStart,1,20,'startposisjon');
  const finish=digits(ui.raceFinish,1,20,'sluttplassering');
  const pits=digits(ui.racePits,0,99,'pitstopp');
  const sectors=prepared.length?['','','']:[ui.s1,ui.s2,ui.s3].map(v=>String(v||'').trim());
  if(sectors.some(x=>x)&&sectors.some(x=>!x))throw Error('Fyll inn alle tre sektorer, eller la alle stå tomme.');
  if(sectors.some(x=>x)&&sectors.some(x=>parseTime(x)==null))throw Error('En sektortid er ugyldig.');
  if(sectors.every(Boolean)&&Math.abs(sectors.map(parseTime).reduce((a,b)=>a+b,0)-time)>2)throw Error('Sektorene må til sammen bli lik beste rundetid.');
  const id=crypto.randomUUID?crypto.randomUUID():String(Date.now());
  const chosenTyres=ui.raceUsedTyres||[];
  if(!prepared.length&&!chosenTyres.length)throw Error('Velg minst ett dekk du brukte i løpet.');
  const bestTyre=best?best.tyre:(chosenTyres.includes(ui.raceBestTyre)?ui.raceBestTyre:chosenTyres[0]);
  const used=[...new Set(prepared.length?prepared.map(r=>r.tyre):chosenTyres)];
  const byTyre={};for(const r of prepared){if(!byTyre[r.tyre]||r.totalMs<byTyre[r.tyre].totalMs)byTyre[r.tyre]={timeMs:r.totalMs,lapNumber:r.lapNumber};}
  if(!prepared.length)byTyre[bestTyre]={timeMs:time,lapNumber:lapNumber||null};
  const createdAt=new Date().toISOString();
  const newRace={id,trackId:ui.trackId,season:data.season,car:ui.car,weather:ui.weather,status:ui.raceStatus,startPos:start,finishPos:finish,laps,pits,notes:ui.raceNotes.trim(),bestTimeMs:time,bestLapNumber:lapNumber,bestTyre,usedTyres:used,bestByTyre:byTyre,scannedLaps:prepared.length,createdAt};
  const toSave=prepared.length?prepared:[{lapNumber:lapNumber||'',totalMs:time,tyre:bestTyre}];
  const newLaps=toSave.map((r,i)=>({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+i+1),raceId:id,trackId:ui.trackId,season:data.season,car:ui.car,session:'Løp',weather:ui.weather,tyre:r.tyre,tyreAge:'',lapNumber:r.lapNumber,s1:prepared.length?r.s1:sectors[0],s2:prepared.length?r.s2:sectors[1],s3:prepared.length?r.s3:sectors[2],totalMs:r.totalMs,createdAt}));
  data.races.unshift(newRace);data.laps.unshift(...newLaps);
  if(!persist()){data.races.shift();data.laps.splice(0,newLaps.length);alert('Kunne ikke lagre på telefonen. Ta sikkerhetskopi og prøv igjen.');return;}
  ui.raceLaps=ui.raceBestTime=ui.raceBestLap=ui.raceStart=ui.raceFinish=ui.racePits=ui.raceNotes='';
  ui.raceUsedTyres=[];ui.raceBestTyre='';ui.raceStatus='Fullført';ui.s1=ui.s2=ui.s3='';scanReset();
  notify(`🏁 Race lagret med ${newLaps.length} rundetid${newLaps.length===1?'':'er'}! Alle vises også i Historikk.`);
 }catch(e){alert(e.message);}
}
function saveRace(){
 const fields=[['raceStart','Startposisjon',1,20],['raceFinish','Sluttplassering',1,20],['raceLaps','Antall runder',1,999],['racePits','Pitstopp',0,99]];
 const vals={};
 for(const [key,label,min,max] of fields){const raw=String(ui[key]||'').trim();if(raw&&(!/^\d+$/.test(raw)||Number(raw)<min||Number(raw)>max)){alert(`${label} må være et helt tall mellom ${min} og ${max}.`);return;}vals[key]=raw?Number(raw):null;}
 if(!vals.raceStart){alert('Fyll inn startposisjon.');return;}
 if(ui.raceStatus==='Fullført'&&!vals.raceFinish){alert('Fyll inn sluttplassering, eller velg DNF / DSQ.');return;}
 if(!vals.raceLaps){alert('Fyll inn antall kjørte runder.');return;}
 data.races.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),trackId:ui.trackId,season:data.season,car:ui.car,weather:ui.weather,status:ui.raceStatus,startPos:vals.raceStart,finishPos:ui.raceStatus==='Fullført'?vals.raceFinish:null,laps:vals.raceLaps,pits:vals.racePits,notes:ui.raceNotes.trim(),createdAt:new Date().toISOString()});
 ui.raceStart=ui.raceFinish=ui.raceLaps=ui.racePits=ui.raceNotes='';ui.raceStatus='Fullført';
 persist();notify('🏁 Løpsresultatet er lagret!');
}
function saveSetup(){const values=ui.editValues||setup();if(!Object.values(values).some(v=>String(v).trim())){alert('Fyll inn setup-verdier først.');return;}const matched=data.laps.filter(l=>l.trackId===ui.trackId&&l.season===data.season&&l.car===ui.car&&l.session===ui.session&&l.weather===ui.weather&&l.tyre===ui.tyre).sort((a,b)=>a.totalMs-b.totalMs)[0];const lapSnapshot=matched?{totalMs:matched.totalMs,s1:matched.s1,s2:matched.s2,s3:matched.s3,tyre:matched.tyre,tyreAge:matched.tyreAge}:null;data.setups.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),trackId:ui.trackId,season:data.season,car:ui.car,session:ui.session,weather:ui.weather,tyre:ui.tyre,lapSnapshot,values:{...values},note:ui.editNote,createdAt:new Date().toISOString()});persist();notify(matched?'Biloppsettet er lagret med beste registrerte tid og sektorer!':'Biloppsettet er lagret! Legg inn en tid for å sammenligne ytelsen.');}
function downloadBackup(){const blob=new Blob([JSON.stringify({format:'F1-25-Lap-Tracker-Backup',version:1,...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`f1-25-backup-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function decodeXml(s){return String(s||'').replace(/<[^>]*>/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();}
async function refreshNews(){ui.newsStatus='Henter nyheter …';render();try{const feed='https://feeds.bbci.co.uk/sport/formula1/rss.xml';const endpoint='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);const res=await fetch(endpoint,{cache:'no-store'});if(!res.ok)throw Error('Kunne ikke hente');const json=await res.json();if(!Array.isArray(json.items)||!json.items.length)throw Error('Tom strøm');ui.news=json.items.slice(0,12).filter(x=>/^https?:\/\//.test(x.link)).map(x=>({title:decodeXml(x.title),description:decodeXml(x.description).slice(0,160),url:x.link,date:x.pubDate?new Date(x.pubDate).toLocaleDateString('nb-NO'):''}));ui.newsStatus=`Oppdatert ${new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'})}`;}catch{ui.newsStatus='Nyhetsstrømmen er utilgjengelig nå. Bruk lenkene til F1 eller BBC over.';}render();}
$('#app').addEventListener('change',async e=>{const el=e.target;if(el.id==='v27-race-file'){const f=el.files?.[0];if(f){try{if(f.size>1024*1024)throw Error('Filen er for stor.');raceImportText(await f.text());}catch(err){alert('Kunne ikke importere: '+err.message);}}return;}if(el.id==='v14-camera'||el.id==='v14-upload'){scanAddFiles(el.files);return;}if(el.dataset.scanRow!==undefined){const row=scanRows[Number(el.dataset.scanRow)];if(row){row[el.dataset.scanKey]=el.value;if(el.dataset.scanKey==='time')row.timeEstimated=false;if(['s1','s2','s3'].includes(el.dataset.scanKey))row.autoCorrected=false;scanReconcileRow(row,scanRows);render();}return;}if(el.id==='raceBestTyre'){ui.raceBestTyre=el.value;return;}if(el.id==='season-select'){data.season=Number(el.value);persist();render();}else if(el.id==='car-select'){ui.car=el.value;ui.issue='none';ui.editValues=null;render();}});
$('#app').addEventListener('input',e=>{const el=e.target;if(el.id==='search'){ui.search=el.value;const list=TRACKS.filter(t=>`${t.name} ${t.country}`.toLowerCase().includes(ui.search.trim().toLowerCase()));$('#track-list').innerHTML=list.map(card).join('')||'<div class="empty">Fant ingen baner.</div>';return;}if(el.dataset.scanRow!==undefined){const row=scanRows[Number(el.dataset.scanRow)];if(row)row[el.dataset.scanKey]=el.value;return;}if(el.dataset.field){ui[el.dataset.field]=el.value;if(['s1','s2','s3'].includes(el.dataset.field)){const vals=[ui.s1,ui.s2,ui.s3].map(parseTime);const total=$('#total');if(vals.every(v=>v!=null)){total.value=formatTime(vals.reduce((a,b)=>a+b,0));total.readOnly=true;}else{total.value=ui.total;total.readOnly=false;}}return;}if(el.dataset.setup){ui.editValues=ui.editValues||setup();ui.editValues[el.dataset.setup]=el.value;return;}if(el.id==='setup-note'){ui.editNote=el.value;}});
$('#app').addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action,v=btn.dataset.value;switch(action){case 'nav':scanReset();ui.screen=v;ui.trackId=null;ui.settings=false;ui.notice='';render(true);break;case 'settings':ui.settings=!ui.settings;ui.trackId=null;ui.notice='';render(true);break;case 'season':data.season=Number(v);persist();render();break;case 'track':ui.settings=false;openTrack(v);break;case 'back':scanReset();ui.trackId=null;ui.screen='tracks';ui.notice='';render(true);break;case 'detailtab':ui.tab=v;if(v==='setup'&&ui.session==='Løp')ui.session='Trening';ui.notice='';render();break;case 'car':ui.car=v;ui.issue='none';ui.editValues=null;render();break;case 'session':ui.session=v;ui.editValues=null;render();break;case 'log-filter':ui.logFilter=v;render();break;case 'race-status':ui.raceStatus=v;render();break;case 'weather':ui.weather=v;if(v==='Vått'&&!['Intermediate','Wet'].includes(ui.tyre))ui.tyre='Intermediate';if(v==='Tørt'&&['Intermediate','Wet'].includes(ui.tyre))ui.tyre='Medium';ui.editValues=null;render();break;case 'tyre':ui.tyre=v;render();break;case 'issue':ui.issue=v;render();break;case 'save-lap':saveLap();break;case 'save-race':saveRace();break;case 'save-race-v12':saveRaceV12();break;case 'scan-camera':$('#v14-camera')?.click();break;case 'scan-upload':$('#v14-upload')?.click();break;case 'scan-run':await scanRun();break;case 'race-import-paste':try{raceImportText($('#v27-race-paste')?.value||'');}catch(err){alert('Kunne ikke importere: '+err.message);}break;case 'scan-remove':{const i=Number(v);if(scanFiles[i]){URL.revokeObjectURL(scanFiles[i].url);scanFiles.splice(i,1);scanStatus='Bilde fjernet.';render();}break;}case 'scan-add-row':scanRows.push({lapNumber:'',time:'',tyre:''});scanStatus='Fyll inn runden og velg dekk.';render();break;case 'scan-delete-row':scanRows.splice(Number(v),1);render();break;case 'race-used-tyre':ui.raceUsedTyres=ui.raceUsedTyres||[];ui.raceUsedTyres=ui.raceUsedTyres.includes(v)?ui.raceUsedTyres.filter(t=>t!==v):[...ui.raceUsedTyres,v];if(!ui.raceUsedTyres.includes(ui.raceBestTyre))ui.raceBestTyre=ui.raceUsedTyres[0]||'';render();break;case 'delete-race':if(confirm('Slette dette løpsresultatet?')){data.races=data.races.filter(r=>r.id!==v);data.laps=data.laps.filter(l=>l.raceId!==v);persist();render();}break;case 'delete-lap':if(confirm('Slette denne rundetiden?')){data.laps=data.laps.filter(l=>l.id!==v);persist();render();}break;case 'use-recommended':ui.editValues={...setup()};ui.editor=true;notify('Anbefalingen er lagt inn i «Mitt biloppsett». Du kan lagre eller redigere den.');break;case 'use-adjusted':ui.editValues={...adjust(setup()).values};ui.editor=true;notify('Testverdiene er lagt inn i «Mitt biloppsett».');break;case 'toggle-editor':ui.editor=!ui.editor;if(ui.editor&&!ui.editValues)ui.editValues={...setup()};render();break;case 'save-setup':saveSetup();break;case 'delete-setup':if(confirm('Slette dette biloppsettet?')){data.setups=data.setups.filter(s=>s.id!==v);persist();render();}break;case 'load-setup':{const found=data.setups.find(s=>s.id===v);if(found){ui.editValues={...found.values};ui.editNote=found.note||'';ui.editor=true;notify('Lagret setup åpnet.');}break;}case 'news-refresh':await refreshNews();break;case 'external':if(/^https:\/\//.test(v))window.open(v,'_blank','noopener,noreferrer');break;case 'export':downloadBackup();break;case 'import':{const file=$('#import-file')?.files?.[0];if(!file){alert('Velg en sikkerhetskopi først.');break;}try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.laps)||!Array.isArray(parsed.setups))throw Error('Ugyldig fil');if(!confirm('Dette erstatter rundetidene og setupene i denne appen. Fortsette?'))break;data={laps:parsed.laps,setups:parsed.setups,races:Array.isArray(parsed.races)?parsed.races:[],season:Number(parsed.season)||2025};persist();notify('Sikkerhetskopien er gjenopprettet!');}catch{alert('Kunne ikke lese sikkerhetskopien.');}break;}}});
render();
